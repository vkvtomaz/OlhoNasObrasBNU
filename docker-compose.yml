services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: portal_obras
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: portal
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal -d portal_obras"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: ./apps/api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://portal:portal@db:5432/portal_obras
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
  web:
    build: ./apps/web
    environment:
      NEXT_PUBLIC_API_URL: http://api:8000/api/v1
    ports: ["3000:3000"]
    depends_on:
      api: { condition: service_healthy }
volumes:
  postgres_data:

